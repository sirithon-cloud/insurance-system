<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ผู้ใช้งานออนไลน์</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- บังคับให้ต้อง login ก่อนเข้าใช้งานหน้านี้ เหมือนหน้าอื่นๆ ในระบบ
         (การเรียก requireLogin() สำเร็จ จะเริ่มส่งสถานะ "กำลังใช้งานอยู่" ของตัวเองด้วยอัตโนมัติ
         ผ่าน startPresenceHeartbeat() ที่อยู่ใน auth.js) -->
    <script src="auth.js"></script>
    <script>
        requireLogin();
    </script>

    <style>
        body{ font-family:"Kanit","Segoe UI",sans-serif; }

        .pulse-dot{
            position:relative;
            display:inline-block;
            width:10px;
            height:10px;
            border-radius:999px;
            background:#22c55e;
            flex:0 0 auto;
        }
        .pulse-dot::after{
            content:"";
            position:absolute;
            inset:0;
            border-radius:999px;
            background:#22c55e;
            animation:pulseRing 1.6s ease-out infinite;
        }
        @keyframes pulseRing{
            0%{ transform:scale(1); opacity:.7; }
            100%{ transform:scale(2.4); opacity:0; }
        }

        .skeleton{ animation:pulse 1.4s ease-in-out infinite; }
        @keyframes pulse{
            0%,100%{ opacity:1; }
            50%{ opacity:.5; }
        }

        .offline-dot{
            display:inline-block;
            width:8px;
            height:8px;
            border-radius:999px;
            background:#cbd5e1;
            flex:0 0 auto;
        }
    </style>
</head>
<body class="bg-gray-100 pb-12">

    <!-- Header -->
    <header class="bg-white shadow-sm sticky top-0 z-10 px-4 py-3">
        <div class="flex justify-between items-center">
            <div class="flex items-center gap-2">
                <button onclick="location.href='index.html'"
                    class="w-8 h-8 flex items-center justify-center rounded-lg bg-gray-100 text-gray-600 hover:bg-gray-200 transition">
                    ←
                </button>
                <div>
                    <h1 class="text-lg font-bold text-slate-800">🟢 ผู้ใช้งานออนไลน์</h1>
                    <p class="text-xs text-gray-500"></p>
                </div>
            </div>
        </div>
    </header>

    <!-- [เพิ่มใหม่] หน้าจอ "ระบบกำลังอยู่ในขั้นตอนพัฒนา" แสดงแทนเนื้อหาจริงเมื่อ PAGE_LOCKED = true
         (ดูค่านี้ได้ใน <script type="module"> ด้านล่าง) ยังกดเข้าหน้านี้ได้ปกติ
         แค่ไม่โหลด/แสดงข้อมูลจริง และไม่เปิดการเชื่อมต่อ Firestore เลย (ประหยัด read ไปในตัว) -->
    <div id="lockedScreen" class="hidden max-w-md mx-auto p-4">
        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-8 text-center mt-6">
            <div class="text-4xl mb-3">🚧</div>
            <h2 class="font-bold text-slate-800 mb-2">ระบบกำลังอยู่ในขั้นตอนพัฒนา</h2>
            <p class="text-sm text-gray-400">หน้านี้ปิดปรับปรุงชั่วคราว กรุณากลับมาใหม่ภายหลัง</p>
        </div>
    </div>

    <main class="max-w-md mx-auto p-4 space-y-4" id="mainContent">

        <!-- สรุปจำนวนคนออนไลน์ -->
        <div class="bg-emerald-600 text-white p-4 rounded-2xl shadow-sm flex items-center justify-between">
            <div>
                <p class="text-xs text-emerald-100">กำลังใช้งานอยู่ตอนนี้</p>
                <h3 class="text-2xl font-bold mt-1" id="onlineCount">0 คน</h3>
            </div>
            <div class="pulse-dot"></div>
        </div>

        <!-- ช่องค้นหา -->
        <div class="relative">
            <input type="text" id="userSearch" placeholder="🔍 ค้นหาชื่อพนักงาน..."
                class="w-full bg-white border border-gray-200 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-emerald-500 shadow-sm">
        </div>

        <!-- รายชื่อผู้ใช้งาน -->
        <div class="space-y-3" id="userList">
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 skeleton">
                <div class="h-4 bg-gray-200 rounded w-1/3 mb-3"></div>
                <div class="h-3 bg-gray-100 rounded w-2/3"></div>
            </div>
        </div>

        <div id="emptyState" class="hidden text-center text-gray-400 text-sm py-10">
            ไม่มีใครใช้งานอยู่ในขณะนี้
        </div>

    </main>

<script type="module">
import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";

/* ตั้งค่าเดียวกับทุกหน้าในระบบ เพื่ออ่าน collection เดียวกัน */
const firebaseConfig = {
    apiKey: "AIzaSyCNpaYlwrkJhBA-8tAax022PWWFYMRz7Kw",
    authDomain: "insurance-system-f26b0.firebaseapp.com",
    projectId: "insurance-system-f26b0",
    storageBucket: "insurance-system-f26b0.firebasestorage.app",
    messagingSenderId: "438698153100",
    appId: "1:438698153100:web:a553b97b59701883f057a9",
    measurementId: "G-XXWCQEMT0B"
};

const app = getApps().length ? getApp() : initializeApp(firebaseConfig);
const db = getFirestore(app);

/* ถือว่า "ออนไลน์" ถ้า auth.js ส่ง online:true มาพร้อม heartbeat (lastActive) ล่าสุดไม่เกิน 30 วินาทีที่ผ่านมา
   [แก้ไข] เกณฑ์ออนไลน์/ออฟไลน์เปลี่ยนเป็น 30 วินาทีตามที่กำหนด และคำนวณฝั่งหน้าเว็บล้วนๆ
   (ดู setInterval(render, 1000) ด้านล่าง) ไม่มีการอ่าน Firestore เพิ่มเพื่อคำนวณค่านี้เลย
   ยังคงแสดงพนักงานทุกคนในระบบตลอด แค่สลับข้อความเป็น "ออฟไลน์ • ใช้งานล่าสุด ... ที่แล้ว" แทนเหมือนเดิม */
/* [แก้ไขด่วน] ปรับให้สัมพันธ์กับ heartbeat ใหม่ใน auth.js (60 วินาที)
   ตั้งเกณฑ์ไว้ 2 เท่าของ heartbeat (120 วินาที) กัน "กระพริบ" เป็นออฟไลน์ผิดพลาด
   ถ้า network หน่วงหรือ heartbeat รอบล่าสุดมาช้ากว่าปกตินิดหน่อย */
const ONLINE_THRESHOLD_MS = 120 * 1000;

/* รายชื่อพนักงานทั้งหมดในระบบ (ให้ตรงกับตาราง EMAIL_TO_NAME ใน auth.js) เพื่อให้หน้านี้
   แสดงพนักงานทุกคนเสมอ แม้บางคนจะยังไม่เคยล็อกอิน/ไม่มี heartbeat เข้ามาเลยก็ตาม */
const ALL_EMPLOYEES = [
    "ณุพล วิทยาขาว",
    "อรุณลักษณ์ มหาจตุพัฒน์",
    "วิภาพร คำเฮ้า",
    "รัชนก ผางโคกสูง",
    "วรรณิภา วิเศษบุตร",
    "สุนิษา ยางไธสงค์",
    "เพ็ญพักตร์ ปลื้มใจ",
    "สุชาวดี ภิษุณี",
    "ไอลัดดา ดวงกุลสา",
    "น้ำทิพย์ ใบลี",
    "ศิริธร สอนสอาด"
];

/* รูปพนักงาน (ชุดเดียวกับหน้า revenue.html) ใส่ path รูปในโฟลเดอร์ "photos/" ข้างๆ ไฟล์เว็บนี้
   ถ้าไม่มีชื่อในตารางนี้ หรือหารูปไม่เจอ จะ fallback ไปโชว์ตัวอักษรย่อ (initials) แทนอัตโนมัติ */
const EMPLOYEE_PHOTOS = {
    "วิภาพร คำเฮ้า": "photos/po1.png",
    "วรรณิภา วิเศษบุตร": "photos/po2.png",
    "เพ็ญพักตร์ ปลื้มใจ": "photos/po3.jpg",
    "สุชาวดี ภิษุณี": "photos/po4.png",
    "รัชนก ผางโคกสูง": "photos/po5.png",
    "ไอลัดดา ดวงกุลสา": "photos/po6.png",
    "สุนิษา ยางไธสงค์": "photos/po7.png",
    "น้ำทิพย์ ใบลี": "photos/po8.png",
    "ศิริธร สอนสอาด": "photos/po9.png",
    "อรุณลักษณ์ มหาจตุพัฒน์": "photos/po10.png",
    "ณุพล วิทยาขาว": "photos/po11.png"
};

function getEmployeePhoto(name){
    return EMPLOYEE_PHOTOS[name] || "";
}

/* [เพิ่มใหม่] สวิตช์ล็อกหน้านี้ไว้ชั่วคราว
   true  = โชว์ข้อความ "ระบบกำลังอยู่ในขั้นตอนพัฒนา" แทนเนื้อหาจริงทั้งหมด
           (ไม่เชื่อมต่อ Firestore เลย ไม่มีการอ่าน/เขียนใดๆ จากหน้านี้)
   false = กลับมาใช้งานหน้านี้ตามปกติ
   วิธีปลดล็อก: เปลี่ยนค่านี้กลับเป็น false */
const PAGE_LOCKED = true;

if (PAGE_LOCKED) {
    document.getElementById("mainContent").classList.add("hidden");
    document.getElementById("lockedScreen").classList.remove("hidden");
}

let presenceData = [];

const RANDOM_COLORS = ["from-blue-500 to-blue-600","from-emerald-500 to-emerald-600","from-purple-500 to-purple-600","from-pink-500 to-pink-600","from-amber-500 to-amber-600","from-cyan-500 to-cyan-600"];

function colorFor(name){
    let hash = 0;
    for(let i=0;i<name.length;i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
    return RANDOM_COLORS[Math.abs(hash) % RANDOM_COLORS.length];
}

function initials(name){
    const parts = String(name || "?").trim().split(/\s+/);
    return (parts[0] ? parts[0][0] : "?").toUpperCase();
}

function timeAgoText(ms){
    const diffSec = Math.max(0, Math.floor((Date.now() - ms) / 1000));
    if(diffSec < 20) return "ออนไลน์อยู่ตอนนี้";
    if(diffSec < 60) return `${diffSec} วินาทีที่แล้ว`;
    const diffMin = Math.floor(diffSec / 60);
    if(diffMin < 60) return `${diffMin} นาทีที่แล้ว`;
    const diffHour = Math.floor(diffMin / 60);
    if(diffHour < 24) return `${diffHour} ชั่วโมงที่แล้ว`;
    const diffDay = Math.floor(diffHour / 24);
    return `${diffDay} วันที่แล้ว`;
}

/* แก้ไข: ใช้เฉพาะกับข้อความ "ออฟไลน์ • ..." เท่านั้น (ต่างจาก timeAgoText() ด้านบน
   ที่มีไว้ใช้ตอนยังออนไลน์อยู่) เดิมโค้ดเอา timeAgoText() มาต่อท้ายคำว่า "ออฟไลน์"
   ตรงๆ ทำให้กรณีเพิ่งออฟไลน์ไปไม่ถึง 20 วินาที ขึ้นข้อความขัดแย้งกันเองเป็น
   "ออฟไลน์ • ออนไลน์อยู่ตอนนี้" ฟังก์ชันนี้แก้เฉพาะช่วง < 20 วินาที ให้เป็น
   "เมื่อสักครู่นี้" แทน ส่วนช่วงเวลาอื่นๆ ใช้ข้อความเดิมทั้งหมด */
function offlineAgoText(ms){
    const diffSec = Math.max(0, Math.floor((Date.now() - ms) / 1000));
    if(diffSec < 20) return "เมื่อสักครู่นี้";
    return timeAgoText(ms);
}

/* รวมรายชื่อพนักงานทั้งหมด (ALL_EMPLOYEES) เข้ากับข้อมูล presence ล่าสุดจาก Firestore
   คนที่ไม่มี presence เลย (ยังไม่เคยล็อกอิน) จะได้ hasPresence:false
   คนที่มี presence แต่ auth.js ปิดสถานะไว้ตอนล็อกเอาท์ (online:false) จะได้ isOnline:false
   แต่ยังคง lastMs (เวลาล็อกเอาท์/ใช้งานล่าสุด) ไว้ให้แสดงผลได้ */
function buildFullList(){
    const now = Date.now();
    const map = new Map();

    ALL_EMPLOYEES.forEach(name => {
        map.set(name, { name, page:"", lastMs:0, isOnline:false, hasPresence:false });
    });

    presenceData.forEach(u => {
        const lastMs = (u.lastActive && typeof u.lastActive.toMillis === "function") ? u.lastActive.toMillis() : 0;
        const name = u.name || "ไม่ทราบชื่อ";
        const isOnline = (u.online === true) && lastMs > 0 && (now - lastMs) < ONLINE_THRESHOLD_MS;
        map.set(name, { name, page: u.page || "", lastMs, isOnline, hasPresence: lastMs > 0 });
    });

    return [...map.values()];
}

function render(){

    const searchTerm = (document.getElementById("userSearch").value || "").trim().toLowerCase();

    let rows = buildFullList()
        .sort((a,b) => {
            // ออนไลน์มาก่อนเสมอ, ในกลุ่มเดียวกันเรียงตามใช้งานล่าสุดใหม่สุดก่อน,
            // คนที่ไม่เคยมี presence เลยไปอยู่ท้ายสุด เรียงตามชื่อ
            if(a.isOnline !== b.isOnline) return a.isOnline ? -1 : 1;
            if(a.hasPresence !== b.hasPresence) return a.hasPresence ? -1 : 1;
            if(a.hasPresence) return b.lastMs - a.lastMs;
            return a.name.localeCompare(b.name, "th");
        });

    const onlineCount = rows.filter(u => u.isOnline).length;
    document.getElementById("onlineCount").innerText = `${onlineCount} คน`;

    if(searchTerm){
        rows = rows.filter(u => (u.name || "").toLowerCase().includes(searchTerm));
    }

    const listEl = document.getElementById("userList");
    const emptyEl = document.getElementById("emptyState");

    if(rows.length === 0){
        listEl.innerHTML = "";
        emptyEl.classList.remove("hidden");
        return;
    }
    emptyEl.classList.add("hidden");

    listEl.innerHTML = rows.map(u => {

        let statusHtml, borderClass;

        if(u.isOnline){
            borderClass = "border-emerald-200";
            statusHtml = `<span class="inline-flex items-center gap-1.5 text-xs font-semibold text-emerald-600"><span class="pulse-dot" style="width:8px;height:8px;"></span> กำลังใช้งานอยู่</span>`;
        } else if(u.hasPresence){
            borderClass = "border-gray-100";
            statusHtml = `<span class="inline-flex items-center gap-1.5 text-xs text-gray-400"><span class="offline-dot"></span> ออฟไลน์ • ${offlineAgoText(u.lastMs)}</span>`;
        } else {
            borderClass = "border-gray-100";
            statusHtml = `<span class="inline-flex items-center gap-1.5 text-xs text-gray-300"><span class="offline-dot"></span> ยังไม่เคยเข้าใช้งาน</span>`;
        }

        const photoUrl = getEmployeePhoto(u.name);
        const ringClass = u.isOnline ? "ring-2 ring-emerald-400" : "ring-1 ring-gray-200";
        const gradientClass = colorFor(u.name || "?");
        const initialsText = initials(u.name);

        // [แก้ไข] เดิมใช้ onerror="this.outerHTML='<div ...>'" ยัด HTML ที่มีเครื่องหมาย " ซ้อนเข้าไปใน
        // แอตทริบิวต์ที่ครอบด้วย " เหมือนกัน ทำให้ browser ตัดแอตทริบิวต์ก่อนจบข้อความจริง เห็นเป็น
        // ตัวอักษร/เครื่องหมายคำพูดเพี้ยนๆ หลุดออกมาเป็นข้อความบนหน้า เปลี่ยนมาวาง <img> กับ fallback
        // div ซ้อนกันไว้ในกล่องเดียว แล้วสลับ display ด้วย onerror แทน ไม่ต้องยัด HTML ในแอตทริบิวต์อีก
        const avatarHtml = `
            <div class="relative w-11 h-11 flex-shrink-0">
                <div class="w-11 h-11 rounded-full flex items-center justify-center font-bold text-white text-sm bg-gradient-to-br ${gradientClass}">
                    ${initialsText}
                </div>
                ${photoUrl ? `
                <img src="${photoUrl}"
                    class="w-11 h-11 rounded-full object-cover absolute inset-0 ${ringClass}"
                    onerror="this.style.display='none';">
                ` : ""}
            </div>
        `;

        return `
        <div class="bg-white p-4 rounded-2xl shadow-sm border ${borderClass} ${!u.isOnline && !u.hasPresence ? "opacity-70" : ""}">
            <div class="flex items-center gap-3">

                ${avatarHtml}

                <div class="min-w-0 flex-1">
                    <h4 class="font-bold text-slate-800 text-sm truncate">${u.name || "ไม่ทราบชื่อ"}</h4>
                    <p class="text-xs text-gray-400 truncate">${u.page ? "📄 " + u.page : ""}</p>
                </div>

                <div class="text-right flex-shrink-0">
                    ${statusHtml}
                </div>

            </div>
        </div>
        `;
    }).join("");
}

/* [แก้ไข] เพิ่มการ "หยุดฟัง" (unsubscribe) ชั่วคราวเมื่อผู้ใช้สลับไปแท็บ/แอปอื่นเป็นเวลานาน
   เพราะตราบใดที่ onSnapshot() ยังเปิดค้างอยู่ Firestore จะยังคิด read ทุกครั้งที่มีคนอื่น heartbeat
   เข้ามา (ทุก ๆ ~25 วินาทีต่อคนที่ออนไลน์อยู่) แม้จะไม่มีใครมองหน้าจอนี้อยู่เลยก็ตาม
   หน่วงไว้ 5 นาทีก่อนตัดจริง (ไม่ตัดทันทีที่ซ่อนแท็บ) เพื่อกันกรณีสลับแท็บถี่ๆ ไปๆ มาๆ
   ซึ่งถ้าตัด-ต่อใหม่ทุกครั้งจะยิ่งเปลืองกว่าเดิม (ตอนต่อใหม่ต้องอ่านทั้ง collection 1 รอบเสมอ) */
let unsubscribePresence = null;
let hiddenUnsubTimer = null;
const HIDDEN_UNSUB_DELAY_MS = 5 * 60 * 1000;

function subscribePresence(){
    if (unsubscribePresence) return; // ฟังอยู่แล้ว ไม่ต้องต่อซ้ำ
    unsubscribePresence = onSnapshot(collection(db, "activeUsers"), (snapshot) => {
        presenceData = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
        render();
    });
}

function unsubscribePresenceNow(){
    if (unsubscribePresence) {
        unsubscribePresence();
        unsubscribePresence = null;
    }
}

/* อ่านข้อมูลจาก Firestore ครั้งแรกตอนเปิดหน้า (initial snapshot) แล้วหลังจากนั้น onSnapshot()
   จะส่งเฉพาะ "การเปลี่ยนแปลง" (เอกสารที่ถูกเพิ่ม/แก้ไข/ลบ) เข้ามาเท่านั้น ไม่มีการ query/getDocs()
   ซ้ำเป็นรอบๆ อีกเลย (ไม่ใช่ทุก 25 วินาทีเหมือนเดิม) */
/* [เพิ่มใหม่] ถ้าหน้านี้ถูกล็อกไว้ (PAGE_LOCKED = true) จะไม่เริ่มการเชื่อมต่อ Firestore
   ไม่เปิด onSnapshot ไม่ตั้ง setInterval ใดๆ เลย เพื่อไม่ให้เสีย read/write โดยเปล่าประโยชน์
   ระหว่างที่หน้านี้ปิดปรับปรุงอยู่ */
if (!PAGE_LOCKED) {

    subscribePresence();

    document.addEventListener("visibilitychange", () => {
        if (document.hidden) {
            // ซ่อนแท็บ: ตั้งเวลาไว้ก่อน 5 นาที ยังไม่ตัดทันที
            hiddenUnsubTimer = setTimeout(unsubscribePresenceNow, HIDDEN_UNSUB_DELAY_MS);
        } else {
            // กลับมาดูหน้านี้: ยกเลิกตัวจับเวลาตัดสาย (ถ้ายังไม่ทันตัด) แล้วฟังต่อ/ฟังใหม่ให้อัตโนมัติ
            if (hiddenUnsubTimer) { clearTimeout(hiddenUnsubTimer); hiddenUnsubTimer = null; }
            subscribePresence();
        }
    });

    /* [แก้ไข] re-render ทุก 1 วินาทีเพื่อคำนวณสถานะออนไลน์/ออฟไลน์ (จาก lastActive ที่มีอยู่ในมือแล้ว)
       และข้อความ "X วินาที/นาทีที่แล้ว" ให้ขยับตามเวลาจริงแบบวินาทีต่อวินาที
       เป็นการคำนวณฝั่งหน้าเว็บล้วนๆ (ใช้ Date.now() เทียบกับ lastActive ที่เก็บไว้ใน presenceData
       จาก onSnapshot ด้านบน) ไม่มีการอ่าน Firestore เพิ่มจากตัวจับเวลานี้เลยแม้แต่ครั้งเดียว */
    setInterval(render, 1000);

    document.getElementById("userSearch").addEventListener("input", render);
}

</script>

</body>
</html>

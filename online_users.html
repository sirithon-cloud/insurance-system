<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ผู้ใช้งานออนไลน์</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- บังคับให้ต้อง login ก่อนเข้าใช้งานหน้านี้ เหมือนหน้าอื่นๆ ในระบบ
         (การเรียก requireLogin() สำเร็จ จะเริ่มส่งสถานะ "กำลังใช้งานอยู่" ของตัวเองด้วยอัตโนมัติ
         ผ่าน startPresenceHeartbeat() ที่อยู่ใน auth.js) -->
    <script src="auth.js"></script>
    <script>
        requireLogin();
    </script>

    <style>
        body{ font-family:"Kanit","Segoe UI",sans-serif; }

        .pulse-dot{
            position:relative;
            display:inline-block;
            width:10px;
            height:10px;
            border-radius:999px;
            background:#22c55e;
            flex:0 0 auto;
        }
        .pulse-dot::after{
            content:"";
            position:absolute;
            inset:0;
            border-radius:999px;
            background:#22c55e;
            animation:pulseRing 1.6s ease-out infinite;
        }
        @keyframes pulseRing{
            0%{ transform:scale(1); opacity:.7; }
            100%{ transform:scale(2.4); opacity:0; }
        }

        .skeleton{ animation:pulse 1.4s ease-in-out infinite; }
        @keyframes pulse{
            0%,100%{ opacity:1; }
            50%{ opacity:.5; }
        }
    </style>
</head>
<body class="bg-gray-100 pb-12">

    <!-- Header -->
    <header class="bg-white shadow-sm sticky top-0 z-10 px-4 py-3">
        <div class="flex justify-between items-center">
            <div class="flex items-center gap-2">
                <button onclick="location.href='index.html'"
                    class="w-8 h-8 flex items-center justify-center rounded-lg bg-gray-100 text-gray-600 hover:bg-gray-200 transition">
                    ←
                </button>
                <div>
                    <h1 class="text-lg font-bold text-slate-800">🟢 ผู้ใช้งานออนไลน์</h1>
                    <p class="text-xs text-gray-500">อัปเดตสถานะแบบเรียลไทม์ ทุก ๆ ประมาณ 25 วินาที</p>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-md mx-auto p-4 space-y-4">

        <!-- สรุปจำนวนคนออนไลน์ -->
        <div class="bg-emerald-600 text-white p-4 rounded-2xl shadow-sm flex items-center justify-between">
            <div>
                <p class="text-xs text-emerald-100">กำลังใช้งานอยู่ตอนนี้</p>
                <h3 class="text-2xl font-bold mt-1" id="onlineCount">0 คน</h3>
            </div>
            <div class="pulse-dot"></div>
        </div>

        <!-- ช่องค้นหา -->
        <div class="relative">
            <input type="text" id="userSearch" placeholder="🔍 ค้นหาชื่อพนักงาน..."
                class="w-full bg-white border border-gray-200 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-emerald-500 shadow-sm">
        </div>

        <!-- รายชื่อผู้ใช้งาน -->
        <div class="space-y-3" id="userList">
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 skeleton">
                <div class="h-4 bg-gray-200 rounded w-1/3 mb-3"></div>
                <div class="h-3 bg-gray-100 rounded w-2/3"></div>
            </div>
        </div>

        <div id="emptyState" class="hidden text-center text-gray-400 text-sm py-10">
            ไม่มีใครใช้งานอยู่ในขณะนี้
        </div>

    </main>

<script type="module">
import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";

/* ตั้งค่าเดียวกับทุกหน้าในระบบ เพื่ออ่าน collection เดียวกัน */
const firebaseConfig = {
    apiKey: "AIzaSyCNpaYlwrkJhBA-8tAax022PWWFYMRz7Kw",
    authDomain: "insurance-system-f26b0.firebaseapp.com",
    projectId: "insurance-system-f26b0",
    storageBucket: "insurance-system-f26b0.firebasestorage.app",
    messagingSenderId: "438698153100",
    appId: "1:438698153100:web:a553b97b59701883f057a9",
    measurementId: "G-XXWCQEMT0B"
};

const app = getApps().length ? getApp() : initializeApp(firebaseConfig);
const db = getFirestore(app);

/* ถือว่า "ออนไลน์" ถ้าส่ง heartbeat มาไม่เกิน 90 วินาทีที่ผ่านมา
   (auth.js ส่งทุก 25 วินาที เผื่อระยะเผื่อเน็ตช้า/สลับแท็บไว้พอสมควร)
   ถ้าไม่มี heartbeat นานเกิน 10 นาที จะซ่อนออกจากลิสต์ไปเลย (ถือว่าออกจากระบบ/ปิดเบราว์เซอร์ไปแล้ว) */
const ONLINE_THRESHOLD_MS = 90 * 1000;
const HIDE_AFTER_MS = 10 * 60 * 1000;

let presenceData = [];

const RANDOM_COLORS = ["from-blue-500 to-blue-600","from-emerald-500 to-emerald-600","from-purple-500 to-purple-600","from-pink-500 to-pink-600","from-amber-500 to-amber-600","from-cyan-500 to-cyan-600"];

function colorFor(name){
    let hash = 0;
    for(let i=0;i<name.length;i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
    return RANDOM_COLORS[Math.abs(hash) % RANDOM_COLORS.length];
}

function initials(name){
    const parts = String(name || "?").trim().split(/\s+/);
    return (parts[0] ? parts[0][0] : "?").toUpperCase();
}

function timeAgoText(ms){
    const diffSec = Math.max(0, Math.floor((Date.now() - ms) / 1000));
    if(diffSec < 20) return "ออนไลน์อยู่ตอนนี้";
    if(diffSec < 60) return `${diffSec} วินาทีที่แล้ว`;
    const diffMin = Math.floor(diffSec / 60);
    if(diffMin < 60) return `${diffMin} นาทีที่แล้ว`;
    const diffHour = Math.floor(diffMin / 60);
    return `${diffHour} ชั่วโมงที่แล้ว`;
}

function render(){

    const now = Date.now();
    const searchTerm = (document.getElementById("userSearch").value || "").trim().toLowerCase();

    let rows = presenceData
        .map(u => ({
            ...u,
            lastMs: (u.lastActive && typeof u.lastActive.toMillis === "function") ? u.lastActive.toMillis() : 0
        }))
        .filter(u => u.lastMs > 0 && (now - u.lastMs) < HIDE_AFTER_MS)
        .sort((a,b) => b.lastMs - a.lastMs);

    const onlineCount = rows.filter(u => (now - u.lastMs) < ONLINE_THRESHOLD_MS).length;
    document.getElementById("onlineCount").innerText = `${onlineCount} คน`;

    if(searchTerm){
        rows = rows.filter(u => (u.name || "").toLowerCase().includes(searchTerm));
    }

    const listEl = document.getElementById("userList");
    const emptyEl = document.getElementById("emptyState");

    if(rows.length === 0){
        listEl.innerHTML = "";
        emptyEl.classList.remove("hidden");
        return;
    }
    emptyEl.classList.add("hidden");

    listEl.innerHTML = rows.map(u => {

        const isOnline = (now - u.lastMs) < ONLINE_THRESHOLD_MS;
        const statusHtml = isOnline
            ? `<span class="inline-flex items-center gap-1.5 text-xs font-semibold text-emerald-600"><span class="pulse-dot" style="width:8px;height:8px;"></span> กำลังใช้งานอยู่</span>`
            : `<span class="text-xs text-gray-400">🕒 ${timeAgoText(u.lastMs)}</span>`;

        return `
        <div class="bg-white p-4 rounded-2xl shadow-sm border ${isOnline ? "border-emerald-200" : "border-gray-100"}">
            <div class="flex items-center gap-3">

                <div class="w-11 h-11 rounded-full flex items-center justify-center font-bold text-white text-sm flex-shrink-0 bg-gradient-to-br ${colorFor(u.name || "?")}">
                    ${initials(u.name)}
                </div>

                <div class="min-w-0 flex-1">
                    <h4 class="font-bold text-slate-800 text-sm truncate">${u.name || "ไม่ทราบชื่อ"}</h4>
                    <p class="text-xs text-gray-400 truncate">📄 ${u.page || "-"}</p>
                </div>

                <div class="text-right flex-shrink-0">
                    ${statusHtml}
                </div>

            </div>
        </div>
        `;
    }).join("");
}

onSnapshot(collection(db, "activeUsers"), (snapshot) => {
    presenceData = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
    render();
});

/* re-render ทุก 5 วินาทีเพื่ออัปเดตข้อความ "X วินาที/นาทีที่แล้ว" และสถานะออนไลน์/ออฟไลน์
   ให้ขยับตามเวลาจริง แม้จะไม่มีข้อมูลใหม่จาก Firestore เข้ามาก็ตาม */
setInterval(render, 5000);

document.getElementById("userSearch").addEventListener("input", render);

</script>

</body>
</html>

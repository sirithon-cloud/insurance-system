<script>

};

/* ==========================================================
   โหลดข้อมูลฟอร์มล่าสุด (เหมือนกับ contract_print.html)
========================================================== */
const data = JSON.parse(localStorage.getItem("pdfData"));

function safe(v){ return (v === undefined || v === null || v === "") ? "" : v; }

/* ==========================================================
   ทำให้ช่องติ๊ก (vf-sqbox) และวงกลมตัวเลือก (vf-o) กดติ๊กได้จริง
========================================================== */
function toggleCheck(el){
    if (!el) return;
    el.classList.toggle("on");
}
function toggleRadio(el, groupId){
    if (!el) return;
    const wasOn = el.classList.contains("on");
    document.querySelectorAll(
        '.vf-o[onclick*="' + groupId + '"], .vf-sqbox[onclick*="' + groupId + '"]'
    ).forEach(o => o.classList.remove("on"));
    if (!wasOn) el.classList.add("on");
}
function fmt(n){ return Number(n || 0).toLocaleString(undefined, { minimumFractionDigits: 2 }); }
function fmt0(n){ return Math.round(Number(n || 0)).toLocaleString(); }

/* แปลงวันที่ dd/mm/yyyy (ค.ศ. หรือ พ.ศ.) เป็น Date object */
function parseFlexibleDate(v) {
    if (!v) return null;
    const s = String(v).trim();
    let m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{3,4})$/);
    if (m) {
        let yyyy = parseInt(m[3], 10);
        if (yyyy > 2400) yyyy -= 543;
        return new Date(yyyy, parseInt(m[2], 10) - 1, parseInt(m[1], 10));
    }
    m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
    if (m) {
        let yyyy = parseInt(m[1], 10);
        if (yyyy > 2400) yyyy -= 543;
        return new Date(yyyy, parseInt(m[2], 10) - 1, parseInt(m[3], 10));
    }
    const d = new Date(s);
    return isNaN(d.getTime()) ? null : d;
}

/* เพิ่มใหม่: ชื่อเดือนไทยแบบเต็ม ใช้แปลงวันที่ทั้งหมดในหน้านี้ให้อยู่ในรูปแบบ "5 สิงหาคม 2569" */
const THAI_MONTHS_FULL = ["มกราคม","กุมภาพันธ์","มีนาคม","เมษายน","พฤษภาคม","มิถุนายน","กรกฎาคม","สิงหาคม","กันยายน","ตุลาคม","พฤศจิกายน","ธันวาคม"];

/* แก้ไข: ฟังก์ชันกลางสำหรับแปลงวันที่เป็นข้อความไทยเต็มรูปแบบ เช่น "5 สิงหาคม 2569"
   รับได้ทั้ง Date object โดยตรง และสตริงวันที่ (dd/mm/yyyy หรือ yyyy-mm-dd ทั้งปี ค.ศ./พ.ศ.) */
function toThaiFullDate(v) {
    const d = (v instanceof Date) ? v : parseFlexibleDate(v);
    if (!d || isNaN(d.getTime())) return "-";
    return `${d.getDate()} ${THAI_MONTHS_FULL[d.getMonth()]} ${d.getFullYear() + 543}`;
}

/* แก้ไข: เดิม toMDBE()/toDMBEshort() คืนค่าเป็นรูปแบบตัวเลข (M/D/พ.ศ. หรือ D/M/พ.ศ. แบบย่อ)
   เปลี่ยนให้คืนค่าเป็นวันที่ไทยเต็มรูปแบบเหมือนกันทั้งหมด เพื่อไม่ต้องแก้จุดที่เรียกใช้ทุกจุด */
function toMDBE(v) {
    return toThaiFullDate(v);
}
function toDMBEshort(v) {
    return toThaiFullDate(v);
}
/* คำนวณวันสิ้นสุดกรมธรรม์ = เริ่ม + 1 ปี (คงวันเดิม) ถ้าไม่มี data.end ใช้ */
function addOneYear(v) {
    const d = parseFlexibleDate(v);
    if (!d) return null;
    return new Date(d.getFullYear() + 1, d.getMonth(), d.getDate());
}

/* ==========================================================
   ตัวเลขเป็นข้อความไทย
========================================================== */
function numberToThaiText(numStr) {
    const num = Number(numStr || 0);
    if (isNaN(num) || num === 0) return "-";
    const numText = ["ศูนย์","หนึ่ง","สอง","สาม","สี่","ห้า","หก","เจ็ด","แปด","เก้า"];
    const digitText = ["","สิบ","ร้อย","พัน","หมื่น","แสน","ล้าน"];
    function convert(n) {
        n = String(n);
        let result = "";
        const len = n.length;
        for (let i = 0; i < len; i++) {
            const digit = parseInt(n[i]);
            const place = len - i - 1;
            if (digit === 0) continue;
            if (place === 0 && digit === 1 && len > 1) result += "เอ็ด";
            else if (place === 1 && digit === 1) result += "สิบ";
            else if (place === 1 && digit === 2) result += "ยี่สิบ";
            else {
                result += numText[digit] + digitText[place % 6 > 0 || place === 0 ? place % 6 : 0];
                if (place >= 6) result += "ล้าน";
            }
        }
        return result;
    }
    const parts = num.toFixed(2).split(".");
    let baht = convert(parseInt(parts[0]));
    const satang = parseInt(parts[1]);
    return baht + "บาท" + (satang === 0 ? "ถ้วน" : convert(satang) + "สตางค์");
}

/* ==========================================================
   แผนผ่อนชำระ
========================================================== */
function getInstallmentPlan() {
    let count = parseInt(data.installmentCount, 10);
    const totalAmount = Number(data.total) || 0;
    if (!count || count < 1) {
        // ไม่ได้เลือกจำนวนงวด -> แสดงตารางอ้างอิง 6 งวด ยอด 0.00 (ตามต้นแบบ)
        return { count: 6, perInstallment: 0, placeholder: true };
    }
    const perInstallment = count > 0 ? totalAmount / count : totalAmount;
    return { count, perInstallment, placeholder: false };
}
function getInstallmentDueDate(startDate, index) {
    const day = startDate.getDate();
    const target = new Date(startDate.getFullYear(), startDate.getMonth() + index, 1);
    const lastDay = new Date(target.getFullYear(), target.getMonth() + 1, 0).getDate();
    target.setDate(Math.min(day, lastDay));
    return target;
}

/* ==========================================================
   บังคับให้เนื้อหาแต่ละเอกสารพอดี 1 หน้า A4 เป๊ะ
   (ปรับใหม่ให้เข้ากับ Layout ที่ขยายตัวอักษร/องค์ประกอบขึ้น ~10-15% และ
   ลด margin/padding/เส้นประที่ไม่จำเป็นแล้ว)

   หลักการ: ฟังก์ชันนี้ "วัดความสูงจริง" ของเนื้อหาแต่ละหน้าใหม่ทุกครั้งที่เรียก
   (ไม่ใช่ค่าที่คำนวณตายตัวไว้ล่วงหน้า) แล้วเทียบกับความสูงหน้ากระดาษ A4 จริง
   - ถ้าเนื้อหาพอดีหรือสั้นกว่าหน้ากระดาษ -> ไม่มีการย่อใดๆ (scale = 1) ตัวอักษรและ
     องค์ประกอบจะแสดงผลใหญ่ขึ้นจริงตามที่ปรับ CSS ไว้ด้านบน
   - ย่อ (scale ลง) เฉพาะกรณีเนื้อหาเกินหน้ากระดาษจริงเท่านั้น โดยคำนวณอัตราส่วนใหม่
     จากความสูงเนื้อหาที่วัดได้หลังปรับ Layout แล้ว จึงย่อน้อยที่สุดเท่าที่จำเป็น
     และไม่กระทบตำแหน่งหรือขนาดกระดาษ A4 ที่ใช้พิมพ์ (transform-origin: top left
     รักษาให้จุดเริ่มต้นหน้ากระดาษอยู่ตำแหน่งเดิมเสมอ)
========================================================== */
function fitPagesToA4() {
    document.querySelectorAll(".document-page").forEach(page => {
        const inner = page.querySelector(".page-scale");
        if (!inner) return;

        // รีเซ็ต transform/width ให้สมบูรณ์ก่อนวัดขนาดจริงทุกครั้ง
        // (กันค่าค้างจากรอบก่อนหน้าที่ทำให้วัด contentHeight ผิดพลาดสะสม)
        inner.style.transform = "none";
        inner.style.width = "100%";
        // บังคับ reflow ให้ browser คำนวณ layout ใหม่จริง ๆ ก่อนอ่านค่าความสูง
        // eslint-disable-next-line no-unused-expressions
        inner.offsetHeight;

        const pageHeight = page.clientHeight;
        const contentHeight = inner.scrollHeight;

        // เพิ่ม tolerance เล็กน้อย (2px) เพื่อกัน false-positive จาก sub-pixel rounding
        // ที่ทำให้ระบบ scale ลงทั้งที่เนื้อหาจริง ๆ ไม่ได้ล้นหน้า A4
        // -> ผลคือเมื่อ Layout ใหม่ (ตัวอักษรใหญ่ขึ้น + spacing แน่นขึ้น) ยังพอดีในหน้า
        //    จะไม่ถูกย่อกลับ ตัวอักษรจะใหญ่ขึ้นจริงตามที่ตั้งค่า
        if (contentHeight > pageHeight + 2) {
            const scale = pageHeight / contentHeight;
            inner.style.transform = `scale(${scale})`;
            inner.style.width = (100 / scale) + "%";
        }
    });
}
fitPagesToA4();
window.addEventListener("load", fitPagesToA4);
window.addEventListener("beforeprint", fitPagesToA4);
setTimeout(fitPagesToA4, 500);
setTimeout(fitPagesToA4, 1500);

========================================================== */
function safeFileName(s) {
    return (s || "ไฟล์").toString().trim().replace(/[\\/:*?"<>|]/g, "").replace(/\s+/g, "_");
}
const fileBase = safeFileName(data.customer) + "_" + safeFileName(data.plate);

function isMobileOrTabletDevice() {
    const ua = navigator.userAgent || "";
    return /Android|iPhone|iPad|iPod|Mobile|Windows Phone/i.test(ua);
}

async function generateJPGFiles(options) {
    const scale = (options && options.scale) || 2;
    const quality = (options && options.quality) || 0.95;

    await document.fonts.ready;
    fitPagesToA4();
    await new Promise(r => setTimeout(r, 100));
    await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));

    const pageLabels = { main: "ใบคำขอ", installment: "ใบแจ้งยอดผ่อน", invoice: "ใบแจ้งยอดชำระเงิน" };
    const pages = document.querySelectorAll(".document-page");
    const files = [];

    for (let i = 0; i < pages.length; i++) {
        const canvas = await html2canvas(pages[i], { scale: scale, backgroundColor: "#ffffff", useCORS: true, letterRendering: true });
        const blob = await new Promise(res => canvas.toBlob(res, "image/jpeg", quality));
        const label = pageLabels[pages[i].dataset.doctype || pages[i].id] || pages[i].id || (i + 1);
        const fileName = `${fileBase}_${i + 1}_${label}.jpg`;
        files.push(new File([blob], fileName, { type: "image/jpeg" }));
    }
    return files;
}

async function openImagesForManualSave(files) {
    const dataUrls = await Promise.all(files.map(file => new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(file);
    })));

    const overlay = document.createElement("div");
    overlay.id = "jpgSaveOverlay";
    overlay.style.cssText = `
        position:fixed; inset:0; z-index:999999;
        background:#111; overflow-y:auto;
        -webkit-overflow-scrolling:touch;
        padding:16px 12px 60px;
        font-family:"Segoe UI",Tahoma,sans-serif;
    `;

    const closeBtn = document.createElement("button");
    closeBtn.innerText = "✕ ปิด";
    closeBtn.style.cssText = `
        position:sticky; top:0; float:right;
        background:#dc3545; color:#fff; border:none;
        padding:10px 18px; border-radius:8px; font-size:14px;
        margin-bottom:10px; z-index:2;
    `;
    closeBtn.onclick = () => overlay.remove();

    const hint = document.createElement("p");
    hint.innerText = "📌 กดค้างที่รูปแต่ละภาพด้านล่าง แล้วเลือก \"บันทึกรูปภาพ\" (Save Image) เพื่อบันทึกลงเครื่อง";
    hint.style.cssText = "color:#fff; text-align:center; clear:both; margin:0 0 16px; font-size:14px; line-height:1.6;";

    overlay.appendChild(closeBtn);
    overlay.appendChild(hint);

    dataUrls.forEach(u => {
        const img = document.createElement("img");
        img.src = u;
        img.style.cssText = "display:block; width:100%; max-width:650px; margin:0 auto 22px; border-radius:8px; box-shadow:0 6px 18px rgba(0,0,0,.4);";
        overlay.appendChild(img);
    });

    document.body.appendChild(overlay);
}

    const btn = document.querySelector(".btn-jpg");
    const originalText = btn ? btn.innerText : "";
    if (btn) { btn.innerText = "⏳ กำลังสร้างรูป..."; btn.disabled = true; }

    try {
        const files = await generateJPGFiles();

        if (isMobileOrTabletDevice() && navigator.share && navigator.canShare && navigator.canShare({ files })) {
            try {
                await navigator.share({ files: files });
                return;
            } catch (shareErr) {
                if (shareErr && shareErr.name === "AbortError") return;
            }
        }

        if (isMobileOrTabletDevice()) {
            await openImagesForManualSave(files);
        } else {
            for (const file of files) {
                const link = document.createElement("a");
                link.download = file.name;
                link.href = URL.createObjectURL(file);
                document.body.appendChild(link);
                link.click();
                link.remove();
                await new Promise(r => setTimeout(r, 300));
            }
        }
    } catch (err) {
        alert("สร้างรูป JPG ไม่สำเร็จ: " + err.message);
        console.error(err);
    } finally {
        if (btn) { btn.innerText = originalText; btn.disabled = false; }
    }
}

async function downloadPDF() {
    const btn = document.querySelector(".btn-pdf");
    const originalText = btn.innerText;
    btn.innerText = "⏳ กำลังสร้าง PDF...";
    btn.disabled = true;

    try {
        await document.fonts.ready;
        fitPagesToA4();
        await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
        const { jsPDF } = window.jspdf;
        const pdf = new jsPDF({ unit: "mm", format: "a4" });
        const pageW = pdf.internal.pageSize.getWidth();
        const pageH = pdf.internal.pageSize.getHeight();

        const pages = document.querySelectorAll(".document-page");
        for (let i = 0; i < pages.length; i++) {
            const canvas = await html2canvas(pages[i], { scale: 2, backgroundColor: "#ffffff", useCORS: true, letterRendering: true });
            const imgData = canvas.toDataURL("image/jpeg", 0.95);
            const ratio = Math.min(pageW / canvas.width, pageH / canvas.height);
            const imgW = canvas.width * ratio;
            const imgH = canvas.height * ratio;
            const x = (pageW - imgW) / 2;
            const y = 0;
            if (i > 0) pdf.addPage();
            pdf.addImage(imgData, "JPEG", x, y, imgW, imgH);
        }
        pdf.save(fileBase + ".pdf");
    } catch (err) {
        alert("สร้าง PDF ไม่สำเร็จ: " + err.message);
        console.error(err);
    } finally {
        btn.innerText = originalText;
        btn.disabled = false;
    }
}

document.title = fileBase;
</script>

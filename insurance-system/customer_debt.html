<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">

<title>ลูกหนี้</title>


<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">

<!-- บังคับให้ต้อง login ก่อนเข้าใช้งานหน้านี้ -->
<script src="auth.js"></script>
<script>
    requireLogin();
</script>


<style>

:root{
    --navy:#152A54;
    --blue:#2F6FED;
    --blue-dark:#1E4FC4;
    --blue-light:#EAF1FF;
    --bg:#F3F6FC;
    --surface:#FFFFFF;
    --border:#E4EAF5;
    --text-soft:#6B7A99;

    --coral:#FF8A65;
    --mint:#2FBF9B;
    --sky:#3E7BFA;
}

*{
    box-sizing:border-box;
}

body{

    font-family:"Kanit",sans-serif;
    background:var(--bg);
    padding:30px 15px;

}


.debt-card{

    max-width:1500px;
    margin:0 auto;
    min-height:calc(100vh - 60px);

    background:var(--surface);
    border:1px solid var(--border);
    border-radius:26px;
    box-shadow:0 14px 34px rgba(21,42,84,.10);

    padding:32px;

    overflow-x:auto;
    -webkit-overflow-scrolling:touch;

}



h1{

    text-align:center;
    color:var(--navy);
    font-size:clamp(18px, 4vw, 24px);
    font-weight:700;
    margin-bottom:6px;

}

.debt-subtitle{
    text-align:center;
    color:var(--text-soft);
    font-size:14px;
    margin-bottom:10px;
}



/* =========================
   เพิ่มใหม่: ทำให้ตารางดูเหมือนตาราง Excel
   - เส้นกรอบครบทุกเซลล์ (ไม่ใช่แค่ border-bottom เหมือนเดิม)
   - หัวตารางลอยติดด้านบนเวลาเลื่อน (sticky header) เหมือนแถวหัวคอลัมน์ที่ freeze ไว้ใน Excel
========================= */
.table-scroll{

    width:100%;
    max-height:75vh;
    overflow:auto;
    -webkit-overflow-scrolling:touch;
    touch-action:pan-x pan-y pinch-zoom;
    margin-top:25px;
    border-radius:12px;
    border:1px solid var(--border);

}

table{

    width:100%;
    min-width:1080px;
    border-collapse:collapse;

    font-size:13px;

}



th{

    background:var(--navy);
    color:white;
    font-weight:600;

    padding:10px 6px;

    white-space:nowrap;

    /* เพิ่มใหม่: หัวตารางลอยตามการเลื่อน (เหมือน freeze แถวบนของ Excel) */
    position:sticky;
    top:0;
    z-index:3;

    border:1px solid #2a4276;

}



td{

    padding:6px 6px;

    border:1px solid var(--border);

    text-align:center;

    white-space:nowrap;

    height:44px;

}

/* จอแคบ: ย่อฟอนต์/padding ลงอีกชั้น เพื่อให้เห็นข้อมูลได้มากขึ้นโดยไม่ต้องเลื่อนมากเกินไป */
@media(max-width:768px){

    table{
        font-size:11.5px;
        min-width:920px;
    }

    th{
        padding:8px 5px;
    }

    td{
        padding:5px 5px;
        height:40px;
    }

    .debt-input{
        min-width:56px;
        font-size:11px;
        padding:5px 6px;
    }
}

tbody tr.overdue:hover,
tbody tr.not-overdue:hover,
tbody tr.paid-complete:hover{
    filter:brightness(.97);
}

tbody tr:not(.overdue):not(.not-overdue):not(.paid-complete):hover{
    background:var(--blue-light);
}

/* แถบสีทั้งแถวตามสถานะ (กลับไปใช้พื้นหลังสีทึบแบบเดิม) */
tr.overdue td{
    background:#ff3737;
    color:#ffffff;
    font-weight:600;
}

tr.not-overdue td{
    background:#66ee61d5;
    color:#025c0e;
    font-weight:600;
}

tr.paid-complete td{
    background:var(--blue-light);
    color:var(--blue-dark);
    font-weight:600;
}

/* =========================
   แก้ไข: แถวที่ "จ่ายครบ 4 งวดแล้ว แต่ยังมียอดค้างอยู่" ให้ขึ้นเป็นสีส้มแทน (ไม่ต้องมีกรอบ)
========================= */
tr.debt-carryover td{
    background:#FF9800 !important;
    color:#3a2200 !important;
    font-weight:700;
}

/* =========================
   เพิ่มใหม่: คอลัมน์ "งวดที่..." ที่เกินจากงวดที่ 4 (กรณีลูกค้าชำระเกิน 4 งวดแล้วยังไม่หมด)
   ให้ขอบด้านขวาเป็นสีแดงเด่นชัด เพื่อบอกว่านี่คือคอลัมน์งวดที่ต่อขยายเพิ่มมาจากงวดปกติ (1-4)
========================= */
th.extra-installment{
    background:#7a1010;
    color:#ffe3e3;
    border-right:3px solid #ff3737 !important;
}

td.extra-installment-cell{
    border-right:3px solid #ff3737 !important;
}

/* =========================
   เพิ่มใหม่: ช่องกรอกข้อมูลในตาราง (โหมดแก้ไข/บันทึก/ลบ)
========================= */
.debt-input{
    width:100%;
    min-width:70px;
    padding:6px 8px;
    border:1.5px solid var(--border);
    border-radius:8px;
    background:var(--surface);
    font-family:"Kanit",sans-serif;
    font-size:12.5px;
    text-align:center;
    color:var(--navy);
}

.debt-input:disabled{
    background:transparent;
    border-color:transparent;
    color:inherit;
    font-weight:600;
    cursor:default;
}

.debt-input:not(:disabled){
    background:#fffef0;
    border-color:#ffb648;
    color:#152A54;
}

.debt-input:not(:disabled):focus{
    outline:none;
    border-color:var(--blue);
    box-shadow:0 0 0 3px var(--blue-light);
}

/* =========================
   เพิ่มใหม่: คอลัมน์ "จัดการ" (แก้ไข / บันทึก / ลบ) อยู่ท้ายสุดของตาราง
   แก้ไข: กำหนดความกว้างตายตัวให้พอดีกับปุ่มทั้ง 4 ปุ่มเสมอ (เดิมไม่ได้กำหนดความกว้าง
   ทำให้บางจอเห็นปุ่มไม่ครบ/ปุ่มถูกบีบจนซ้อนกัน) และเพิ่มเงาด้านซ้ายให้ดูเป็นคอลัมน์ที่ "ตรึงอยู่"
   ชัดเจนขึ้น (เหมือน freeze pane ของ Excel)
========================= */
th.debt-action-th,
td.debt-action-td{
    position:sticky;
    right:0;
    z-index:2;
    background:var(--surface);

    width:152px;
    min-width:152px;
    max-width:152px;

    box-shadow:-3px 0 6px rgba(21,42,84,.10);
}

th.debt-action-th{
    z-index:5;
    background:var(--navy);
}

/* แก้ไข: ทำให้คอลัมน์ "จัดการ" ที่ตรึงไว้ ใช้สีพื้นหลังตรงกับสถานะของแถวนั้นเสมอ
   (เดิมคอลัมน์นี้ตายตัวเป็นสีขาว/เทาอ่อนแม้แถวนั้นจะเป็นแถวสีแดง/เขียว/ส้ม ทำให้ดูเหมือน
   ข้อมูลแถวนั้นๆ "ขาดหาย" ไปช่วงคอลัมน์สุดท้าย) ใช้ !important เพื่อชนะกฎพื้นฐานด้านบนแน่นอน */
tr.overdue td.debt-action-td{ background:#ff3737 !important; }
tr.not-overdue td.debt-action-td{ background:#66ee61d5 !important; }
tr.paid-complete td.debt-action-td{ background:var(--blue-light) !important; }
tr.debt-carryover td.debt-action-td{ background:#FF9800 !important; }

/* =========================
   เพิ่มใหม่: ตรึงคอลัมน์ "ลำดับ / เกินกำหนด(วัน) / เงินที่ค้าง / ชื่อ / ทะเบียน" ไว้ด้านซ้ายเสมอ
   (freeze pane เหมือน Excel) เพื่อให้เลื่อนดูงวด/ยอดเงินทางขวาได้ โดยยังเห็นข้อมูลสำคัญของลูกค้า
   รายนี้อยู่ตลอด ไม่ต้องเลื่อนกลับไปดู
   ลำดับความกว้าง (สะสม left ต่อกันตามลำดับ):
   ลำดับ 40px -> เกินกำหนด(วัน) 78px -> เงินที่ค้าง 92px -> ชื่อ 130px -> ทะเบียน 100px
========================= */
th.debt-frozen-col,
td.debt-frozen-col{
    position:sticky;
    z-index:2;
    background:var(--surface);
}

th.debt-frozen-col{
    z-index:5;
    background:var(--navy);
}

th.debt-col-index, td.debt-col-index{
    left:0;
    width:40px;
    min-width:40px;
    max-width:40px;
}

th.debt-col-overdue, td.debt-col-overdue{
    left:40px;
    width:78px;
    min-width:78px;
    max-width:78px;
}

th.debt-col-debt, td.debt-col-debt{
    left:118px;
    width:92px;
    min-width:92px;
    max-width:92px;
}

th.debt-col-name, td.debt-col-name{
    left:210px;
    width:130px;
    min-width:130px;
    max-width:130px;
    white-space:normal;
}

th.debt-col-plate, td.debt-col-plate{
    left:340px;
    width:100px;
    min-width:100px;
    max-width:100px;

    /* เส้นแบ่งชัดเจนระหว่างคอลัมน์ที่ตรึงไว้กับคอลัมน์ที่เลื่อนได้ */
    box-shadow:3px 0 6px rgba(21,42,84,.10);
}

/* คงสีพื้นหลังของคอลัมน์ที่ตรึงไว้ให้ตรงกับสถานะของแถวเสมอ เหมือนคอลัมน์ "จัดการ" */
tr.overdue td.debt-frozen-col{ background:#ff3737 !important; }
tr.not-overdue td.debt-frozen-col{ background:#66ee61d5 !important; }
tr.paid-complete td.debt-frozen-col{ background:var(--blue-light) !important; }
tr.debt-carryover td.debt-frozen-col{ background:#FF9800 !important; }

@media(max-width:768px){

    th.debt-action-th,
    td.debt-action-td{
        width:126px;
        min-width:126px;
        max-width:126px;
    }

    th.debt-col-index, td.debt-col-index{ width:32px; min-width:32px; max-width:32px; }
    th.debt-col-overdue, td.debt-col-overdue{ left:32px; width:60px; min-width:60px; max-width:60px; }
    th.debt-col-debt, td.debt-col-debt{ left:92px; width:74px; min-width:74px; max-width:74px; }
    th.debt-col-name, td.debt-col-name{ left:166px; width:100px; min-width:100px; max-width:100px; }
    th.debt-col-plate, td.debt-col-plate{ left:266px; width:80px; min-width:80px; max-width:80px; }
}

.debt-actions{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:4px;
    white-space:nowrap;
}

.debt-actions button{
    width:28px;
    height:28px;
    border:none;
    border-radius:6px;
    font-size:13px;
    cursor:pointer;
    flex:0 0 auto;
    transition:.15s;
}

.debt-actions button:hover{
    transform:scale(1.1);
}

@media(max-width:768px){
    .debt-actions{
        gap:3px;
    }
    .debt-actions button{
        width:24px;
        height:24px;
        font-size:11px;
    }
}

.debt-edit-btn{
    background:#ffc000;
    color:#002d72;
}

.debt-save-btn{
    background:#198754;
    color:#fff;
}

.debt-delete-btn{
    background:#dc3545;
    color:#fff;
}

/* เพิ่มใหม่: ปุ่ม "จ่ายงวด" กดจ่ายค่างวดถัดไปได้ทันทีจากตารางลูกหนี้ โดยไม่ต้องไปแก้ที่ฟอร์ม */
.debt-pay-btn{
    background:#2FBF9B;
    color:#fff;
}

/* เพิ่มใหม่: โมดัลจ่ายงวด (เบา ไม่ต้องเปิดโหมดแก้ไขทั้งแถว) */
.debt-pay-overlay{
    position:fixed;
    inset:0;
    background:rgba(21,42,84,.45);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:16px;
    z-index:99998;
    opacity:0;
    visibility:hidden;
    transition:.2s;
}

.debt-pay-overlay.show{
    opacity:1;
    visibility:visible;
}

.debt-pay-box{
    background:var(--surface);
    border-radius:20px;
    max-width:380px;
    width:100%;
    padding:24px;
    box-shadow:0 20px 50px rgba(21,42,84,.3);
    font-family:"Kanit",sans-serif;
    transform:translateY(-10px) scale(.97);
    transition:.2s;
}

.debt-pay-overlay.show .debt-pay-box{
    transform:translateY(0) scale(1);
}

.debt-pay-box h3{
    color:var(--navy);
    font-size:17px;
    margin-bottom:10px;
}

.debt-pay-remaining{
    color:var(--text-soft);
    font-size:14px;
    margin-bottom:16px;
}

.debt-pay-remaining b{
    color:#FF3737;
}

.debt-pay-box label{
    display:block;
    font-size:13px;
    font-weight:600;
    color:var(--navy);
    margin-bottom:6px;
}

.debt-pay-amount-input{
    width:100%;
    padding:12px 14px;
    border-radius:12px;
    border:1.5px solid var(--border);
    font-family:"Kanit",sans-serif;
    font-size:16px;
    color:var(--navy);
    box-sizing:border-box;
}

.debt-pay-amount-input:focus{
    outline:none;
    border-color:var(--blue);
    box-shadow:0 0 0 3px var(--blue-light);
}

.debt-pay-actions{
    display:flex;
    justify-content:flex-end;
    gap:10px;
    margin-top:20px;
}

.debt-pay-actions button{
    padding:10px 20px;
    border:none;
    border-radius:999px;
    font-family:"Kanit",sans-serif;
    font-weight:600;
    font-size:14px;
    cursor:pointer;
    transition:.2s;
}

.debt-pay-cancel-btn{
    background:var(--blue-light);
    color:var(--blue-dark);
}

.debt-pay-cancel-btn:hover{
    background:var(--blue-soft, #DCE9FF);
}

.debt-pay-confirm-btn{
    background:#198754;
    color:#fff;
}

.debt-pay-confirm-btn:hover{
    background:#157347;
}

/* toast แจ้งเตือนแบบไม่บล็อกหน้าจอ */
.debt-toast{
    position:fixed;
    left:50%;
    top:50%;
    transform:translate(-50%, -50%) scale(.95);
    background:#152A54;
    color:#fff;
    padding:16px 28px;
    border-radius:16px;
    font-family:"Kanit",sans-serif;
    font-size:15px;
    font-weight:600;
    box-shadow:0 16px 40px rgba(21,42,84,.32);
    opacity:0;
    z-index:99999;
    pointer-events:none;
    transition:opacity .25s ease, transform .25s ease;
    white-space:nowrap;
}

.debt-toast.show{
    opacity:1;
    transform:translate(-50%, -50%) scale(1);
}

.debt-total{

    margin-top:18px;
    margin-bottom:6px;

    font-size:18px;

    font-weight:600;

    color:var(--navy);

    background:var(--blue-light);
    display:inline-block;
    padding:12px 22px;
    border-radius:16px;

}

/* แถวบนสุดรวมปุ่มกลับ + ยอดลูกหนี้รวม ให้อยู่แถวเดียวกัน */
.debt-top-row{
    display:flex;
    align-items:center;
    justify-content:center;
    flex-wrap:wrap;
    gap:14px;
    margin-top:18px;
    margin-bottom:6px;
}

.debt-top-row .debt-total{
    margin-top:0;
    margin-bottom:0;
}



.back-btn-debt{

    display:inline-flex;
    align-items:center;
    gap:6px;

    background:#79797486;

    color:#fff;

    border:none;

    padding:12px 26px;

    border-radius:999px;

    cursor:pointer;

    font-family:"Kanit";
    font-weight:600;

    font-size:15px;

    transition:.2s;

}

.back-btn-debt:hover{
    background:#C62828;
}


</style>


</head>



<body>


<div class="debt-card">


<h1>
💰 รายงานลูกหนี้
</h1>

<div class="debt-subtitle">
    🍊 คอลัมน์สีส้ม = งวดเกิน 4 งวด (ลูกค้ายังชำระไม่หมด) &nbsp;•&nbsp; กด ✏️ เพื่อแก้ไข, 💾 เพื่อบันทึก, 🗑️ เพื่อลบ
</div>

<div class="debt-top-row">
    <button class="back-btn-debt"
    onclick="location.href='account_menu.html'">
    ← กลับเมนูบัญชี
    </button>

    <div class="debt-total" id="debtTotal"></div>
</div>



<div class="table-scroll">
<table>


<thead>

<!-- แก้ไข: จัดเรียงคอลัมน์ใหม่และ "ตรึง" คอลัมน์สำคัญไว้ทั้ง 2 ฝั่ง (เหมือน freeze pane ของ Excel)
     ฝั่งซ้าย (ตรึงตลอด ไม่เลื่อนหาย): ลำดับ -> เกินกำหนด(วัน) -> เงินที่ค้าง -> ชื่อ -> ทะเบียน
     ฝั่งกลาง (เลื่อนดูได้): เบอร์โทร -> วันที่เริ่ม -> รวม(เบี้ย) -> งวดที่ 1..N
     ฝั่งขวา (ตรึงตลอด): จัดการ
     คอลัมน์ "งวดที่..." ถูกสร้างแบบไดนามิกด้วย JS (ดูฟังก์ชัน renderDebtHeader ด้านล่าง)
     เพื่อรองรับกรณีลูกค้าชำระเกิน 4 งวดแล้วยังไม่หมด ระบบจะขยายจำนวนคอลัมน์งวดให้อัตโนมัติ
     (คอลัมน์งวดที่เกิน 4 จะมีกรอบขวาสีแดงเด่นชัด) -->
<tr id="debtHeadRow">

<th class="debt-frozen-col debt-col-index">ลำดับ</th>

<th class="debt-frozen-col debt-col-overdue">เกินกำหนด(วัน)</th>

<th class="debt-frozen-col debt-col-debt">เงินที่ค้าง</th>

<th class="debt-frozen-col debt-col-name">ชื่อ</th>

<th class="debt-frozen-col debt-col-plate">ทะเบียน</th>

<th>เบอร์โทร</th>

<th>วันที่เริ่ม</th>

<th id="debtHeadTotal">รวม(เบี้ย)</th>

<th class="debt-action-th">จัดการ</th>

</tr>

</thead>



<tbody id="debtTable">


</tbody>



</table>
</div>




</div>


<!-- เพิ่มใหม่: โมดัลจ่ายงวด กดจ่ายค่างวดถัดไปได้ทันทีจากตารางนี้ ไม่ต้องไปเปิดฟอร์มแก้ไข -->
<div class="debt-pay-overlay" id="debtPayOverlay" onclick="if(event.target===this) window.debtClosePayModal()">
    <div class="debt-pay-box">
        <h3 id="debtPayTitle">💵 จ่ายงวด</h3>
        <div class="debt-pay-remaining">ยอดค้างชำระปัจจุบัน: <b id="debtPayRemaining">0</b> บาท</div>

        <label for="debtPayAmount">จำนวนเงินที่จ่ายงวดนี้</label>
        <input type="number" id="debtPayAmount" class="debt-pay-amount-input" min="0" step="1">

        <div class="debt-pay-actions">
            <button type="button" class="debt-pay-cancel-btn" onclick="window.debtClosePayModal()">ยกเลิก</button>
            <button type="button" class="debt-pay-confirm-btn" onclick="window.debtConfirmPayInstallment()">✅ บันทึกการจ่าย</button>
        </div>
    </div>
</div>


<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
import {
    getFirestore,
    collection,
    onSnapshot,
    doc,
    setDoc,
    deleteDoc
} from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";

/* ตั้งค่าเดียวกับ script.js / report.html เพื่ออ่าน/เขียน collection "insuranceData" เดียวกัน */
const firebaseConfig = {
  apiKey: "AIzaSyCNpaYlwrkJhBA-8tAax022PWWFYMRz7Kw",
  authDomain: "insurance-system-f26b0.firebaseapp.com",
  projectId: "insurance-system-f26b0",
  storageBucket: "insurance-system-f26b0.firebasestorage.app",
  messagingSenderId: "438698153100",
  appId: "1:438698153100:web:a553b97b59701883f057a9",
  measurementId: "G-XXWCQEMT0B"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);


function calculateOverdue(date){

    if(!date) return 0;

    // รองรับวันที่แบบ dd/mm/yyyy (ปี ค.ศ. จริงเสมอ ไม่ใช่ พ.ศ.)
    let parts = date.split("/");

    let due;

    if(parts.length === 3){

        due = new Date(
            Number(parts[2]),
            Number(parts[1])-1,
            Number(parts[0])
        );

    }
    else{

        due = new Date(date);

    }

    let today = new Date();

    today.setHours(0,0,0,0);
    due.setHours(0,0,0,0);

    let diff = today - due;

    let days = Math.floor(
        diff / (1000*60*60*24)
    );

    return days > 0 ? days : 0;

}


/* หาจำนวน "งวด" สูงสุดที่ควรแสดงเป็นคอลัมน์
   - ค่าเริ่มต้นขั้นต่ำคือ 4 งวด (installment1-4) เหมือนเดิม
   - ขั้นที่ 1: ถ้าข้อมูลรายการไหนมีฟิลด์ installment5, installment6, ... อยู่แล้วจริงใน Firestore
     (เช่น เคยกรอกไว้จากที่อื่น) ระบบจะขยายจำนวนคอลัมน์งวดตามนั้นก่อน
   - ขั้นที่ 2 (เพิ่มใหม่): ถ้ารายการไหน "กรอกงวดสุดท้ายที่มีอยู่ครบแล้ว" (มีค่าในช่องงวดสุดท้าย)
     แต่ยัง "มียอดค้างชำระ" (รวมยังไม่ครบตามยอดรวม) ให้ขยายคอลัมน์งวดถัดไปเพิ่มให้อัตโนมัติ
     (งวดที่ 5, 6, 7, ... ไปเรื่อยๆ) เพื่อให้กรอกงวดต่อไปได้ทันที
     ถ้าไม่มีรายการไหนเข้าเงื่อนไขนี้เลย จะไม่ขึ้นคอลัมน์เพิ่มโดยไม่จำเป็น */
function getMaxInstallmentCount(data){

    let max = 4;

    // ขั้นที่ 1: ขยายตามฟิลด์ installmentN ที่มีอยู่จริงในข้อมูลก่อน
    data.forEach(item=>{
        Object.keys(item).forEach(key=>{
            const m = key.match(/^installment(\d+)$/);
            if(m){
                const n = parseInt(m[1], 10);
                if(n > max) max = n;
            }
        });
    });

    // ขั้นที่ 2: ถ้ายังมีรายการที่กรอกงวดสุดท้ายเต็มแล้วแต่ยังค้างอยู่ ให้ขยายคอลัมน์ต่อไปอีกทีละ 1
    // วนจนกว่าจะไม่มีรายการไหนต้องการคอลัมน์เพิ่มอีกแล้ว
    let needMore = true;

    while(needMore){

        needMore = false;

        data.forEach(item=>{

            const total = Number(item.total || 0);

            let paid = 0;
            for(let i = 1; i <= max; i++){
                paid += Number(item["installment" + i] || 0);
            }

            const debtAmount = total - paid;

            const lastVal = item["installment" + max];
            const lastFilled = lastVal !== undefined && lastVal !== null && String(lastVal).trim() !== "";

            // ยังค้างอยู่จริง (debtAmount > 0) และงวดสุดท้ายที่มีคอลัมน์อยู่ตอนนี้ถูกกรอกแล้ว
            // แปลว่าต้องเปิดคอลัมน์งวดถัดไปให้กรอกต่อ
            if(debtAmount > 0 && lastFilled){
                needMore = true;
            }

        });

        if(needMore) max++;

    }

    return max;
}


/* สร้าง/อัปเดตหัวตารางคอลัมน์ "งวดที่ N" แบบไดนามิกตามจำนวนงวดสูงสุดที่พบ
   แทรกต่อจากคอลัมน์ "รวม(เบี้ย)" (id="debtHeadTotal") เสมอ
   เพิ่มใหม่: คอลัมน์งวดที่เกินจากงวดปกติ 4 งวด จะได้ class "extra-installment"
   เพื่อให้มีกรอบขวาสีแดงเด่นชัด บอกว่าเป็นงวดที่ต่อขยายเพิ่ม */
function renderDebtHeader(maxInstallments){

    const headRow = document.getElementById("debtHeadRow");

    // ลบคอลัมน์งวดเก่าที่เคยสร้างไว้ก่อนหน้า (กันสร้างซ้ำเวลาข้อมูลอัปเดต)
    headRow.querySelectorAll(".debt-installment-th").forEach(th => th.remove());

    const totalTh = document.getElementById("debtHeadTotal");

    let html = "";
    for(let i = 1; i <= maxInstallments; i++){
        const extraClass = i > 4 ? " extra-installment" : "";
        html += `<th class="debt-installment-th${extraClass}">งวดที่ ${i}</th>`;
    }

    totalTh.insertAdjacentHTML("afterend", html);
}


function renderDebt(data, maxInstallments){


/*
 เอาเฉพาะรายการที่มียอดค้าง
*/

let debt = data;



debt.forEach(item=>{


    let total = Number(item.total || 0);


    let paid = 0;
    for(let i = 1; i <= maxInstallments; i++){
        paid += Number(item["installment" + i] || 0);
    }



    item.debtAmount = total - paid;



    item.overdue =
    calculateOverdue(item.end);

});


/*
 เรียงเกินกำหนดมากสุดขึ้นก่อน
*/


debt.sort((a,b)=>{


return b.overdue-a.overdue;


});





let html="";



debt.forEach((item,index)=>{


let rowClass = "";

if(item.debtAmount <= 0){

    rowClass = "paid-complete";

}
else if(item.overdue > 0){

    rowClass = "overdue";

}
else{

    rowClass = "not-overdue";

}

/* เพิ่มใหม่: ตรวจว่ารายการนี้ "จ่ายครบ 4 งวดแล้ว (มีค่าในงวดที่ 1-4 ครบ) แต่ยังมียอดค้างอยู่" หรือไม่
   ถ้าใช่ ให้ติด class "debt-carryover" เพื่อขึ้นกรอบแดงรอบแถว (ไม่กระทบสีพื้นหลังเดิมของแถว) */
let paidThrough4 = true;
for(let i = 1; i <= 4; i++){
    const v = item["installment" + i];
    if(v === undefined || v === null || String(v).trim() === ""){
        paidThrough4 = false;
        break;
    }
}
const isCarryover = paidThrough4 && item.debtAmount > 0;
if(isCarryover){
    rowClass += " debt-carryover";
}



/* เพิ่มใหม่: ช่องกรอกงวดที่ 1..N แบบแก้ไขได้ในตาราง
   คอลัมน์งวดที่เกิน 4 จะมี class "extra-installment-cell" ให้กรอบขวาเป็นสีแดงตรงกับหัวตาราง */
let installmentCells = "";
for(let i = 1; i <= maxInstallments; i++){
    const extraClass = i > 4 ? " extra-installment-cell" : "";
    installmentCells += `
        <td class="${extraClass.trim()}">
            <input type="number"
                class="debt-input"
                data-row="${item.id}"
                data-field="installment${i}"
                value="${item["installment" + i] || ""}"
                disabled>
        </td>`;
}



html+=`

<tr class="${rowClass}" data-row="${item.id}">


<td class="debt-frozen-col debt-col-index">${index+1}</td>

<td class="debt-frozen-col debt-col-overdue">
${item.overdue}
</td>

<td class="debt-frozen-col debt-col-debt">
${item.debtAmount.toLocaleString()}
</td>

<td class="debt-frozen-col debt-col-name">
    <input type="text"
        class="debt-input"
        data-row="${item.id}"
        data-field="customer"
        value="${item.customer || ""}"
        disabled>
</td>

<td class="debt-frozen-col debt-col-plate">
    <input type="text"
        class="debt-input"
        data-row="${item.id}"
        data-field="plate"
        value="${item.plate || ""}"
        disabled>
</td>

<td>
    <input type="text"
        class="debt-input"
        data-row="${item.id}"
        data-field="phone"
        value="${item.phone || ""}"
        disabled>
</td>

<td>
    <input type="text"
        class="debt-input"
        data-row="${item.id}"
        data-field="start"
        value="${item.start || ""}"
        disabled>
</td>

<td>
    <input type="number"
        class="debt-input"
        data-row="${item.id}"
        data-field="total"
        value="${item.total || ""}"
        disabled>
</td>

${installmentCells}

<td class="debt-action-td">
    <div class="debt-actions">
        <button class="debt-pay-btn" onclick="window.debtPayInstallment('${item.id}')" title="จ่ายงวด">💵</button>
        <button class="debt-edit-btn" onclick="window.debtToggleEdit('${item.id}')" title="แก้ไข">✏️</button>
        <button class="debt-save-btn" onclick="window.debtSaveRow('${item.id}')" title="บันทึก">💾</button>
        <button class="debt-delete-btn" onclick="window.debtDeleteRow('${item.id}')" title="ลบ">🗑️</button>
    </div>
</td>

</tr>


`;


});



document.getElementById("debtTable").innerHTML=html;



let totalDebt=debt.reduce(
(sum,item)=>sum+item.debtAmount,0
);



document.getElementById("debtTotal").innerText=

"ยอดลูกหนี้รวม : "+
totalDebt.toLocaleString()+
" บาท";



}


/* =========================
   เพิ่มใหม่: แก้ไข / บันทึก / ลบ ข้อมูลแต่ละแถวโดยตรงในตาราง (เหมือนตาราง Excel ที่แก้ได้)
========================= */

function showDebtToast(message){
    let toast = document.createElement("div");
    toast.className = "debt-toast";
    toast.innerText = message;
    document.body.appendChild(toast);

    requestAnimationFrame(() => toast.classList.add("show"));

    setTimeout(() => {
        toast.classList.remove("show");
        setTimeout(() => toast.remove(), 300);
    }, 2200);
}

/* กด ✏️ แก้ไข: เปิดให้แก้ไขทุกช่องของแถวนั้น (เดิมเป็น disabled ใช้แสดงผลอย่างเดียว) */
window.debtToggleEdit = function(id){
    const inputs = document.querySelectorAll(`input[data-row="${id}"]`);
    inputs.forEach(inp => { inp.disabled = false; });
    if(inputs.length) inputs[0].focus();
};

/* กด 💾 บันทึก: รวบรวมค่าจากทุกช่องของแถวนั้น แล้วบันทึกกลับ Firestore ด้วย merge:true
   (ไม่กระทบ field อื่นที่ไม่ได้แสดงในตารางนี้ เช่น address, chassis, group ฯลฯ) */
window.debtSaveRow = async function(id){

    const inputs = document.querySelectorAll(`input[data-row="${id}"]`);

    if(!inputs.length) return;

    const fields = {};

    inputs.forEach(inp=>{
        const field = inp.dataset.field;
        fields[field] = inp.value;
    });

    try{

        await setDoc(
            doc(db, "insuranceData", id),
            fields,
            { merge:true }
        );

        inputs.forEach(inp => { inp.disabled = true; });

        showDebtToast("✅ บันทึกข้อมูลเรียบร้อย");

    }catch(err){

        console.error("บันทึกข้อมูลไม่สำเร็จ:", err);
        alert("บันทึกข้อมูลไม่สำเร็จ: " + (err.message || "กรุณาลองใหม่อีกครั้ง"));

    }

};

/* กด 🗑️ ลบ: ลบเอกสารออกจาก Firestore โดยตรง (onSnapshot จะอัปเดตตารางให้อัตโนมัติทุกเครื่อง) */
window.debtDeleteRow = async function(id){

    if(!confirm("ต้องการลบข้อมูลนี้หรือไม่ ?")) return;

    try{

        await deleteDoc(doc(db, "insuranceData", id));
        showDebtToast("🗑️ ลบข้อมูลเรียบร้อย");

    }catch(err){

        console.error("ลบข้อมูลไม่สำเร็จ:", err);
        alert("ลบข้อมูลไม่สำเร็จ: " + (err.message || "กรุณาลองใหม่อีกครั้ง"));

    }

};


/* เพิ่มใหม่: เก็บข้อมูลล่าสุด + จำนวนงวดสูงสุดปัจจุบันไว้ใช้กับโมดัล "จ่ายงวด"
   (หาแถวจาก id และหางวดถัดไปที่ยังว่างได้ทันที โดยไม่ต้องอ่านจาก DOM) */
let currentDebtData = [];
let currentMaxInstallments = 4;
let currentPayItem = null;

/* ฟังข้อมูลจาก Firestore แบบ realtime — อัปเดตอัตโนมัติทุกครั้งที่มีการบันทึก/แก้ไข/ลบ
   จากหน้า form_car.html / form_product.html / report.html / finance.html หรือจากตารางนี้เอง */
onSnapshot(collection(db, "insuranceData"), (snapshot) => {

    const data = snapshot.docs.map(d => ({
        id: d.id,
        ...d.data()
    }));

    currentDebtData = data;

    const maxInstallments = getMaxInstallmentCount(data);
    currentMaxInstallments = maxInstallments;

    renderDebtHeader(maxInstallments);
    renderDebt(data, maxInstallments);

});

/* =========================================================
   เพิ่มใหม่: จ่ายเฉพาะ "ค่างวด" ได้ทันทีจากตารางลูกหนี้ ไม่ต้องไปเปิดฟอร์มแก้ไขทั้งใบ
   - กดปุ่ม 💵 -> ระบบหางวดถัดไปที่ยังไม่ได้กรอกให้อัตโนมัติ (ถ้างวดที่มีคอลัมน์อยู่ตอนนี้
     ถูกกรอกครบหมดแล้วแต่ยังมียอดค้าง จะเปิดงวดถัดไปเพิ่มให้เองเหมือนตอนกรอกในฟอร์ม)
   - บันทึกด้วย setDoc({merge:true}) ลง field installmentN ของรายการนั้นตรงๆ ใน collection
     "insuranceData" เดียวกับที่ report.html / finance.html / revenue.html อ่านอยู่แล้ว
     ทำให้ยอดค้างในตารางนี้และตัวเลขในหน้ารายงานอัปเดตตรงกันทันทีแบบ realtime
     โดยไม่ต้องแก้ไขข้อมูลอื่นของลูกค้ารายนั้นเลย
========================================================= */
/* แก้ไข (ตามคำขอ): กด "ชำระงวด" แล้วส่งข้อมูลลูกค้ารายนี้ไปบันทึกการชำระเงินที่หน้า finance.html
   โดยอัตโนมัติแทนการเปิดโมดัลในหน้านี้ พนักงานไม่ต้องค้นหา/เลือกลูกค้าซ้ำที่หน้า finance.html เลย
   ระบบจะคำนวณ "งวดที่ยังไม่ได้ชำระ" ให้อัตโนมัติและส่งไปพร้อมกันผ่าน localStorage
   (โมดัลจ่ายงวดเดิมของหน้านี้ยังคงมีโค้ดอยู่เผื่อใช้ในอนาคต แต่ปุ่ม "ชำระงวด" จะไม่เปิดโมดัลนี้อีกต่อไป) */
window.debtPayInstallment = function(id){

    const item = currentDebtData.find(x => x.id === id);
    if(!item){
        alert("ไม่พบข้อมูลลูกค้ารายนี้ อาจมีการอัปเดตข้อมูลไปแล้ว กรุณาลองใหม่อีกครั้ง");
        return;
    }

    const total = Number(item.total || 0);

    let paid = 0;
    for(let i = 1; i <= currentMaxInstallments; i++){
        paid += Number(item["installment" + i] || 0);
    }

    const debtAmount = total - paid;

    if(debtAmount <= 0){
        showDebtToast("✅ ลูกค้ารายนี้ไม่มียอดค้างชำระแล้ว");
        return;
    }

    // หางวดถัดไปที่ยังไม่ได้กรอก (ว่างหรือเป็น 0) ภายในจำนวนงวดที่มีคอลัมน์อยู่ตอนนี้
    let nextSlot = null;
    for(let i = 1; i <= currentMaxInstallments; i++){
        const v = item["installment" + i];
        const isEmpty = v === undefined || v === null || String(v).trim() === "" || Number(v) === 0;
        if(isEmpty){
            nextSlot = i;
            break;
        }
    }

    // งวดที่มีคอลัมน์อยู่ตอนนี้ถูกกรอกครบหมดแล้ว แต่ยังมียอดค้าง -> เปิดงวดถัดไปเพิ่มให้เอง
    if(nextSlot === null){
        nextSlot = currentMaxInstallments + 1;
    }

    // ยอดที่ควรเรียกเก็บของงวดนี้ (ถ้ามีแผนจำนวนงวด (installmentCount) ให้หารเฉลี่ยเท่าๆ กัน
    // ถ้าไม่มีแผน ให้ใช้ยอดค้างทั้งหมดเป็นค่าเริ่มต้น)
    const planCount = parseInt(item.installmentCount, 10) || 0;
    const perInstallment = planCount > 0 ? (total / planCount) : debtAmount;
    const dueAmount = Math.max(0, Math.min(debtAmount, perInstallment > 0 ? perInstallment : debtAmount));

    localStorage.setItem("financePayTarget", JSON.stringify({
        id: item.id,
        customer: item.customer || "",
        company: item.company || "",
        plate: item.plate || "",
        start: item.start || "",
        phone: item.phone || "",
        total: total,
        debtAmount: debtAmount,
        installmentNumber: nextSlot,
        dueAmount: dueAmount,
        recordedBy: (typeof getEmployeeName === "function") ? getEmployeeName() : ""
    }));

    window.location.href = "finance.html";
};

window.debtClosePayModal = function(){
    document.getElementById("debtPayOverlay").classList.remove("show");
    currentPayItem = null;
};

window.debtConfirmPayInstallment = async function(){

    if(!currentPayItem) return;

    const amountInput = document.getElementById("debtPayAmount");
    const amount = Number(amountInput.value);

    if(!amount || amount <= 0){
        alert("กรุณากรอกจำนวนเงินที่จ่ายให้ถูกต้อง");
        return;
    }

    try{

        await setDoc(
            doc(db, "insuranceData", currentPayItem.id),
            { [currentPayItem.field]: amount },
            { merge: true }
        );

        showDebtToast("✅ บันทึกการจ่ายงวดเรียบร้อย");
        window.debtClosePayModal();

    }catch(err){

        console.error("บันทึกการจ่ายงวดไม่สำเร็จ:", err);
        alert("บันทึกไม่สำเร็จ: " + (err.message || "กรุณาลองใหม่อีกครั้ง"));

    }

};


</script>

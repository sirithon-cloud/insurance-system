<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>  เมนูบัญชี - ประกันรถยนต์</title>

    <link rel="stylesheet" href="style.css">

    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- เพิ่มใหม่: บังคับให้ต้อง login ก่อนเข้าใช้งานหน้านี้ (เดิมเข้าตรงผ่าน URL ได้โดยไม่ต้อง login) -->
    <script src="auth.js"></script>
    <script>
        requireLogin();
    </script>
</head>


<body>


<!-- SIDEBAR -->
<div class="sidebar" id="sidebar">

    <h2>📋 ระบบประกันกับคุณพลอย</h2>

    <ul style="list-style:none;padding:0 10px;">
        <li>
            <a href="index.html" class="active">
                🏠 หน้าแรก
            </a>
        </li>
        <li>
            <a href="revenue.html">
                📈 กราฟรายได้
            </a>
        </li>
    </ul>

</div>

<div id="overlay"></div>

<!-- TOPBAR -->
<header class="topbar">
    <button id="menuBtn">☰</button>
    <img src="logo.png" class="toplogo" alt="logo">
    <span class="apptitle">เมนูบัญชี - ประกันรถยนต์</span>
</header>


<!-- CONTENT -->

<main class="main account-page">


    <h2 class="title">
        📒 เมนูบัญชีประกันรถยนต์
    </h2>
    



    <div class="cards">

        <a href="report_v2.html" class="card account-card">

            <span class="icon">
                📊
            </span>

            <h3>
                รายงานประกันรถยนต์
            </h3>
        </a>




        <a href="customer_debt_car.html" class="card">

            <span class="icon">
                💰
            </span>

            <h3>
                ลูกหนี้
            </h3>

        </a>




        <a href="finance_car.html" class="card">

            <span class="icon">
                💵
            </span>

            <h3>
                บันทึกการเงิน
            </h3>

        </a>


    </div>



    <div class="bottom-actions">

        <a href="documents_v2.html" class="nav-back-btn">
            ⬅ กลับหน้าประกันรถยนต์
        </a>

    </div>





</main>

<script>


const menuBtn = document.getElementById("menuBtn");
const sidebar = document.getElementById("sidebar");
const overlay = document.getElementById("overlay");

if(menuBtn && sidebar){
    menuBtn.addEventListener("click",()=>{
        sidebar.classList.toggle("show");
        if(overlay) overlay.classList.toggle("show");
    });
}

if(overlay){
    overlay.addEventListener("click",()=>{
        sidebar.classList.remove("show");
        overlay.classList.remove("show");
    });
}


</script>
</body>
</html>
